name: Обновление данных сайта

on:
  schedule:
    - cron: '0 12 * * *' # Запускать каждый день в 12:00 по UTC
  workflow_dispatch: # Добавляет кнопку для ручного запуска

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать файлы репозитория
        uses: actions/checkout@v3

      - name: Установить Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Установить библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запустить скрипт
        run: python scraper.py

      - name: Сохранить изменения в data.json
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add data.json
          git commit -m "Автообновление данных с сайта" || echo "Нет новых изменений"
          git push
