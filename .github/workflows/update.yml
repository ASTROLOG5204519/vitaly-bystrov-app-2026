name: Обновление данных сайта

on:
  schedule:
    - cron: '0 12 * * *' # Запускать каждый день в 12:00 по UTC
  workflow_dispatch: # Добавляет кнопку для ручного запуска

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать файлы репозитория
        uses: actions/checkout@v3

      - name: Установить Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Установить библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запустить скрипт
        run: python update.py

            - name: Сохранить изменения в data.json
        run: |
          if [ -f has_changes.txt ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "auto: обновлены данные с сайта Pixieset"
            # Используем токен для авторизации при пуше
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
            echo "✅ Данные успешно обновлены и сохранены!"
          else
            echo "ℹ️ Новых данных нет, всё актуально."
          fi
