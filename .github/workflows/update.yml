name: Update Pixieset Data via RSS

on:
  schedule:
    - cron: '0 9 * * *'  # Каждый день в 12:00 МСК
  workflow_dispatch:      # Ручной запуск

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch RSS and update data.json
        uses: jaywcjlove/rss-action@main
        with:
          rss-url: "https://vitalibystrov.mypixieset.com/journal/rss"
          output: "data.json"
          format: "json"
          limit: 50  # Максимум 50 последних записей

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "auto: updated from RSS feed" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
